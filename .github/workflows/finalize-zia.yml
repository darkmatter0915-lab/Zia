name: Finalize and Publish Zia

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-zia.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

concurrency:
  group: zia-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply final fixes
        run: node scripts/finalize-zia.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        run: npm run build

      - name: Commit verified source and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/views.js package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Finalize Zia 1.0"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Zia
        id: deployment
        uses: actions/deploy-pages@v4
