name: Deploy Zia to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check prohibited legacy references
        run: |
          set -euo pipefail
          if grep -R -n -E 'premium-pack|premium-boot|premium-payload|CSS[[:space:]]*方塊|方塊角色' warrior-asset-lab src/warrior-asset-lab public/warrior-asset-lab; then
            echo 'Warrior Asset Lab must not reference the retired premium-pack or block-character implementation.'
            exit 1
          fi

      - name: Check and build
        run: npm run build

      - name: Verify Warrior Asset Lab output
        run: |
          set -euo pipefail
          test -f dist/warrior-asset-lab/index.html
          grep -R -q 'WAITING_FOR_WARRIOR_ASSET' dist/warrior-asset-lab dist/assets
          grep -R -q 'assets/characters/warrior/warrior.glb' dist/warrior-asset-lab dist/assets
          echo 'Warrior Asset Lab build output verified.'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
