name: Verify and deploy Zia
on:
  push:
    branches: [main, fix/warrior-lab-hardening-20260905]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests and production build
        run: |
          set -euo pipefail
          mkdir -p verification
          git rev-parse HEAD > verification/source-commit.txt
          npm test | tee verification/unit.log
          npm run build | tee verification/build.log
          npm run verify:dist | tee verification/output.log
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-test-evidence
          path: |
            test-results/
            verification/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Check published Asset Lab and manifest
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "${SITE}warrior-asset-lab/?build=${GITHUB_SHA}" > /tmp/lab.html && curl -fsSL "${SITE}warrior-asset-lab/asset-status.json?build=${GITHUB_SHA}" > /tmp/manifest.json && grep -q WAITING_FOR_WARRIOR_ASSET /tmp/lab.html && grep -q assets/characters/warrior/warrior.glb /tmp/manifest.json; then
              echo "LIVE_PAGES_HTTP_CHECK_PASSED ${SITE}warrior-asset-lab/"
              cat /tmp/manifest.json
              exit 0
            fi
            sleep 5
          done
          exit 1
