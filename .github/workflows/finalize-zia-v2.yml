name: Finalize and Publish Zia v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-zia-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: zia-finalize-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply final fixes
        run: node scripts/finalize-zia.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify and build
        run: npm run build

      - name: Commit verified source and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/views.js package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Finalize Zia 1.0"
            git push
          fi

      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Zia
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record result and clean temporary workflows
        if: always()
        continue-on-error: true
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p docs
          cat > docs/DEPLOYMENT.md <<EOF
          # Zia Deployment Status

          - Build: passed
          - Deployment step: ${DEPLOY_OUTCOME:-not-run}
          - Page URL: ${PAGE_URL:-unavailable}
          - Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Verified commit: $(git rev-parse HEAD)
          EOF
          git rm -f .github/workflows/finalize-zia.yml .github/workflows/finalize-zia-v2.yml
          git add docs/DEPLOYMENT.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Zia deployment verification"
            git push
          fi
