<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08060b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>地下城重生｜暗金像素冒險</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030207;color:#f4d68c;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#271536 0,#09060d 48%,#020104 100%)}.load{width:min(88vw,520px);padding:34px 28px;text-align:center;border:1px solid #8b633c;background:linear-gradient(#18121eec,#09070cec);box-shadow:inset 0 0 0 3px #261b28,inset 0 0 32px #000,0 0 46px #713a8d55;clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px)}.rune{font-size:46px;color:#c683ff;text-shadow:0 0 20px #a448df;animation:p 1.1s ease-in-out infinite alternate}.title{font-size:clamp(27px,6vw,42px);font-weight:900;letter-spacing:.12em;color:#f3c66b;text-shadow:0 3px #5a2812,0 0 18px #dc8f3c55;margin:9px 0 4px}.sub{font:700 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2em;color:#bca7c7}.bar{height:10px;margin:25px 0 12px;border:1px solid #74563b;background:#060409;overflow:hidden}.fill{height:100%;width:8%;background:linear-gradient(90deg,#6e3dab,#bc60ee,#f0bd5b);box-shadow:0 0 14px #b55cea;transition:width .22s}.msg{min-height:22px;font-size:14px;color:#dfd1e4}.tip{margin-top:17px;font-size:11px;line-height:1.65;color:#887b91}button{display:none;margin:18px auto 0;padding:11px 22px;border:1px solid #e3b867;background:#4b273e;color:#fff1c4;font-weight:900;font-size:15px}@keyframes p{to{transform:scale(1.1);filter:brightness(1.25)}}
</style>
</head>
<body>
<main class="load"><div class="rune">◆</div><div class="title">地下城重生</div><div class="sub">PREMIUM PIXEL ADVENTURE</div><div class="bar"><div class="fill" id="fill"></div></div><div class="msg" id="msg">召回角色與地下城美術…</div><button id="retry" type="button">重新載入</button><div class="tip">首次載入約數秒。完成後請將手機或平板橫放，角色選擇與戰鬥介面會完整展開。</div></main>
<script>
window.__DR_PREMIUM='';
const PARTS=6,fill=document.getElementById('fill'),msg=document.getElementById('msg'),retry=document.getElementById('retry');let loaded=0;
function fail(text){msg.textContent=text;fill.style.width='100%';fill.style.background='#a5324d';retry.style.display='block'}
retry.addEventListener('click',()=>location.reload());
function next(){if(loaded>=PARTS)return boot();msg.textContent=`載入完整遊戲 ${loaded+1} / ${PARTS}`;fill.style.width=`${10+loaded/PARTS*68}%`;const s=document.createElement('script');s.src=`premium-pack-${String(loaded).padStart(2,'0')}.js?v=20260902-premium4`;s.async=false;s.onload=()=>{loaded++;next()};s.onerror=()=>fail(`遊戲資料 ${loaded+1} 載入失敗，請重新載入`);document.head.appendChild(s)}
async function boot(){try{msg.textContent='正在開啟永夜王城…';fill.style.width='86%';if(!window.__DR_PREMIUM||window.__DR_PREMIUM.length<50000)throw new Error('遊戲資料不完整');if(!('DecompressionStream' in window))throw new Error('請更新 Safari 後重新開啟');const binary=atob(window.__DR_PREMIUM),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!html.includes('DUNGEON REBORN')||html.length<100000)throw new Error('遊戲驗證失敗');fill.style.width='100%';msg.textContent='進入地下城';window.__DR_PREMIUM='';setTimeout(()=>{document.open();document.write(html);document.close()},100)}catch(e){console.error(e);fail(e.message||'遊戲載入失敗')}}
next();
</script>
</body>
</html>
