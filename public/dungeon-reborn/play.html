<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0711">
<title>地下城重生 Dungeon Reborn</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage">
<canvas id="game" width="960" height="540" tabindex="0" aria-label="地下城重生遊戲畫面"></canvas>
<section id="touch" aria-hidden="true">
<div id="joy"><i id="stick"></i></div>
<div id="buttons">
<button data-skill="2">3</button><button data-skill="1">2</button><button data-skill="0">1</button>
<button id="dash">↯</button><button id="attack">⚔</button>
</div>
</section>
<div id="rotate">請將手機橫放<br><small>地下城的門比較寬。</small></div>
</main>
<script src="loader.js"></script>
</body>
</html>
